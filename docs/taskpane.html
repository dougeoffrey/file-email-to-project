<!doctype html><html><head><meta charset="UTF-8"/><meta http-equiv="X-UA-Compatible" content="IE=Edge"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>File Email to Project</title><script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script><link href="bff4725baadf7bce8813.css" rel="stylesheet"/><script defer="defer" src="polyfill.js"></script><script defer="defer" src="taskpane.js"></script></head><body><main id="app-body" class="panel" style="display:none"><div class="eyebrow">SHAREPOINT FILING</div><h1>File email to project</h1><p class="intro">Choose where this email's attachments should be saved.</p><section class="email-card" aria-label="Selected email"><div class="email-icon" aria-hidden="true">✉</div><div><div class="label">Selected email</div><div id="email-subject" class="subject">Loading…</div><div id="attachment-count" class="metadata"></div></div></section><button id="connect-button" type="button" class="secondary">Connect Microsoft 365</button> <label for="project-select">Active project</label> <select id="project-select" disabled="disabled"><option>Projects will be connected next</option></select><div id="folder-field" class="field" hidden><label for="folder-select">Files received folder</label> <select id="folder-select" disabled="disabled"><option>Select a project first</option></select></div><div id="description-field" class="field" hidden><label for="folder-description">Folder description</label> <input id="folder-description" maxlength="80" placeholder="e.g. Structural consultant markups"/><div class="preview-label">New folder</div><div id="folder-name-preview" class="folder-preview"></div></div><button id="save-button" type="button" disabled="disabled">Save attachments</button><p id="status" class="status" role="status">Connect your Microsoft 365 account to continue.</p></main></body></html>
